<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viora</title>
<meta name="theme-color" content="#0b0b12">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--sb:#0f0f18;--card:#16172a;--hov:#1c1d33;--line:#262842;--tx:#ecedf8;--mu:#a1a6c4;--fa:#6f7596;--vi:#7a58ff;--sky:#3b9bf0;--grad:linear-gradient(135deg,#b06bff,#6a63ff 50%,#38c4ff);--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}
:root[data-theme=light]{--bg:#ffffff;--sb:#f6f7fc;--card:#f1f3fb;--hov:#e9ecf8;--line:#e0e4f3;--tx:#161729;--mu:#585e7c;--fa:#8b91ad;--sh:0 10px 40px rgba(40,60,140,.14);color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}a{color:inherit}
#app{display:flex;height:100dvh}
/* sidebar */
#sb{width:272px;flex:none;background:var(--sb);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px;gap:6px;transition:margin .2s;min-height:0}
body.off #sb{margin-left:-272px}
.s-top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px}
.logo{display:flex;align-items:center;gap:9px;font:700 19px "Space Grotesk",sans-serif}
.logo img{width:26px;height:26px;border-radius:8px}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--mu);display:grid;place-items:center;font-size:18px}
.ib:hover{background:var(--hov);color:var(--tx)}
.s-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;text-align:left;color:var(--tx)}
.s-btn:hover{background:var(--hov)}
.s-search{width:100%;background:var(--card);border:1px solid transparent;border-radius:10px;padding:8px 12px;outline:0;font-size:14px}
.s-search:focus{border-color:var(--vi)}
#hist{flex:1;overflow:auto;min-height:60px;margin:0 -4px;padding:0 4px}
.grp{font-size:12px;color:var(--fa);padding:12px 10px 4px;font-weight:500}
.it{display:flex;align-items:center;gap:4px;border-radius:10px;padding:7px 10px;font-size:14.5px;color:var(--mu);cursor:pointer}
.it span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it:hover,.it.on{background:var(--hov);color:var(--tx)}
.it button{border:0;background:none;color:var(--fa);opacity:0;font-size:17px;line-height:1;padding:0 2px}
.it:hover button{opacity:1}
.emp{padding:10px;color:var(--fa);font-size:14px}
#user{position:relative;border-top:1px solid var(--line);padding-top:8px}
.u-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;padding:8px;text-align:left}
.u-btn:hover{background:var(--hov)}
.av{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.u-btn b{font-weight:500;font-size:14.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px;z-index:40;min-width:220px}
#umenu{bottom:60px;left:0;right:0}
.pop button,.pop a{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;text-decoration:none;font-size:14.5px}
.pop button:hover,.pop a:hover{background:var(--hov)}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#hd{display:flex;align-items:center;gap:6px;padding:10px 14px;min-height:56px}
#open{display:none}
body.off #open{display:grid}
.pick{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:7px 12px;font:600 17px "Space Grotesk",sans-serif}
.pick:hover{background:var(--hov)}
.pick i,.opt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pick small{color:var(--fa);font-size:12px}
#amenu{top:52px;left:14px;width:320px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:10px;border-radius:10px;width:100%;border:0;background:none;text-align:left}
.opt:hover{background:var(--hov)}.opt i{margin-top:7px}
.opt b{display:block;font-weight:600}.opt span{display:block;font-size:13px;color:var(--mu);line-height:1.35}
.opt .ck{margin-left:auto;color:var(--vi);font-weight:700}
#scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.wrap{max-width:768px;margin:0 auto;padding:8px 20px 24px}
.m{display:flex;gap:14px;margin:22px 0}
.m.u{justify-content:flex-end}
.m.u .b{background:var(--card);padding:10px 18px;border-radius:22px;max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a>img{width:30px;height:30px;border-radius:9px;flex:none;margin-top:2px}
.m.a .col{flex:1;min-width:0}
.b p{margin:0 0 .85em}.b p:last-child{margin-bottom:0}.b ul{margin:0 0 .85em;padding-left:1.3em}.b li{margin:.2em 0}
.b pre{background:var(--sb);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0 0 1em}
.b code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--card);padding:2px 6px;border-radius:6px}.b pre code{background:none;padding:0}
.b a{color:var(--sky)}.b h3{font:700 1.1em "Space Grotesk",sans-serif;margin:1em 0 .4em}
.cite{font-size:.72em;vertical-align:super;background:var(--card);border-radius:6px;padding:1px 5px;text-decoration:none!important;color:var(--mu)!important}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.srcs a{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mu);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;max-width:230px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.srcs a:hover{color:var(--tx);border-color:var(--vi)}
.note{font-size:13px;color:var(--fa);margin-bottom:8px}
.acts{display:flex;gap:2px;margin-top:6px}
.acts button{border:0;background:none;color:var(--fa);font-size:13px;padding:4px 9px;border-radius:8px}
.acts button:hover{background:var(--hov);color:var(--tx)}
.dots{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tx);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25;transform:scale(.7)}}
/* composer */
#dock{padding:4px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.in{width:100%;max-width:768px;margin:0 auto}
#greet{text-align:center;font:700 clamp(26px,4.5vw,36px) "Space Grotesk",sans-serif;margin:0 0 22px}
#greet small{display:block;font:400 15px Inter,sans-serif;color:var(--mu);margin-top:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px 12px 8px;box-shadow:var(--sh)}
.box:focus-within{border-color:rgba(122,88,255,.7)}
#chip{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--hov);border-radius:12px;padding:5px 6px 5px 12px;font-size:13px;margin:0 0 6px 4px;max-width:100%}
.chip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:330px}
.chip button{border:0;background:none;color:var(--fa);font-size:16px}
#in{width:100%;border:0;outline:0;background:none;resize:none;padding:6px 8px;font-size:16px;line-height:1.55;max-height:200px;display:block}
.tools{display:flex;align-items:center;gap:4px}
.tl{border:1px solid var(--line);background:none;color:var(--mu);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.tl:hover{color:var(--tx);border-color:var(--fa)}
.tl.on{color:var(--sky);border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent)}
#go{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--tx);color:var(--bg);font-size:17px;display:grid;place-items:center;font-weight:700}
#go:disabled{opacity:.25;cursor:default}
#sug{width:100%;max-width:768px;margin:18px auto 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#sug button{border:1px solid var(--line);background:none;color:var(--mu);border-radius:999px;padding:8px 15px;font-size:14px;text-align:left}
#sug button:hover{color:var(--tx);border-color:var(--c)}
.fine{text-align:center;color:var(--fa);font-size:12px;margin:8px 0 0}
#main.empty #scroll{display:none}
#main.empty #dock{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:12vh}
#main.empty .fine{display:none}
#main:not(.empty) #greet,#main:not(.empty) #sug{display:none}
/* dialog */
dialog{background:var(--sb);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 4px;font:700 20px "Space Grotesk",sans-serif}dialog p{margin:0 0 14px;color:var(--mu);font-size:14px}
dialog input[type=url],dialog textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;outline:0}
dialog textarea{min-height:110px;resize:vertical;font:13px ui-monospace,Menlo,monospace}
.dl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 18px;font-weight:500}
.btn.p{background:var(--grad);border:0;color:#fff}.btn:disabled{opacity:.6}
#derr{color:#ff7b8f;font-size:14px;margin-bottom:8px}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
@media(max-width:820px){#sb{position:fixed;inset:0 auto 0 0;z-index:30;width:min(300px,86vw);margin-left:0!important;transform:translateX(-102%);transition:transform .2s}body.drawer #sb{transform:none}#open{display:grid!important}#amenu{left:8px;width:calc(100vw - 32px)}.m.u .b{max-width:92%}#main.empty #dock{padding-bottom:6vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="sb">
    <div class="s-top"><div class="logo"><img src="assets/mark.png" alt="">Viora</div><button class="ib" id="close" aria-label="Close sidebar" title="Close sidebar">⇤</button></div>
    <button class="s-btn" id="new" type="button">✎&nbsp; New chat</button>
    <input class="s-search" id="q" type="search" placeholder="Search chats" aria-label="Search chats">
    <div id="hist"></div>
    <div id="user">
      <div class="pop" id="umenu" hidden>
        <button id="theme" type="button">◐ &nbsp;Switch theme</button>
        <a href="index.html">⌂ &nbsp;Viora home</a>
        <a href="help.html#install">⬇ &nbsp;Get the extension</a>
        <button id="out" type="button">⎋ &nbsp;Sign out</button>
      </div>
      <button class="u-btn" id="ubtn" type="button"><span class="av" id="av"></span><b id="nm"></b></button>
    </div>
  </aside>
  <main id="main" class="empty">
    <header id="hd">
      <button class="ib" id="open" aria-label="Open sidebar">☰</button>
      <button class="pick" id="pick" type="button" aria-haspopup="true"><i></i><span id="pname"></span><small>▾</small></button>
      <div class="pop" id="amenu" hidden></div>
    </header>
    <div id="scroll"><div class="wrap" id="msgs"></div></div>
    <div id="dock">
      <div class="in">
        <h1 id="greet"></h1>
        <div class="box">
          <div id="chip"></div>
          <textarea id="in" rows="1" aria-label="Message"></textarea>
          <div class="tools"><button class="tl" id="att" type="button" title="Attach a web page">＋ Page</button><button class="tl" id="web" type="button" title="Search the web before answering">🌐 Search</button><button id="go" type="button" aria-label="Send" disabled>↑</button></div>
        </div>
      </div>
      <div id="sug"></div>
      <p class="fine">Viora can make mistakes. Check important info.</p>
    </div>
  </main>
</div>
<div id="shade" hidden></div>
<dialog id="dlg">
  <h3>Attach a page</h3>
  <p>Viora reads the page text and answers from it. Enter a web address, or paste HTML or text.</p>
  <input type="url" id="d-url" placeholder="https://example.com/article" autocomplete="off">
  <textarea id="d-txt" placeholder="…or paste the page's HTML or text here"></textarea>
  <div id="derr" role="alert"></div>
  <div class="dl"><label class="btn">Upload .html / .txt<input type="file" id="d-file" accept=".html,.htm,.txt,.md" hidden></label><span style="flex:1"></span><button class="btn" id="d-x" type="button">Cancel</button><button class="btn p" id="d-ok" type="button">Read page</button></div>
</dialog>
<script>
(() => {
'use strict';
const API = 'https://viora-auth-website.onrender.com';
const $ = s => document.querySelector(s);
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const S = ls.get('viora_session', null);
if (!S || !S.token) { location.replace('login.html'); return; }
try { document.documentElement.dataset.theme = localStorage.getItem('viora_theme') || 'dark'; } catch {}
const A = {
  flash:   { n: 'Viora Flash', c: '#8f7bff', b: 'Fast answers for everyday questions', web: 1, ph: 'Message Viora Flash', s: ['Explain how vaccines work', 'Plan a 3-day trip to Lisbon', 'Write a polite deadline-extension email', 'What happened in tech news today?'] },
  search:  { n: 'Viora Deep Search', c: '#3b9bf0', b: 'Searches the web and cites every claim', web: 1, ph: 'What should I look up?', s: ['Latest research on intermittent fasting', 'Compare the newest flagship phones', 'Summarize the news on AI regulation', 'Who won the most recent Formula 1 race?'] },
  math:    { n: 'Viora Math & Code', c: '#2fc08f', b: 'Step-by-step maths and working code', web: 1, ph: 'Give me a problem or some code', s: ['Solve 3x² − 12 = 0 with steps', 'Why does for(i=0;i<5;i--){} never end?', 'Write a Python palindrome checker', 'Explain Big-O notation simply'] },
  automate:{ n: 'Viora Automate', c: '#ee9a2c', b: 'Plans browser steps from a page and a goal', att: 1, ph: 'Attach a page, then describe the goal', s: ['Plan how to sign up on this page', 'Which form fields are required here?', 'Plan how to find the contact details'] },
  human:   { n: 'Viora Humanizer', c: '#ee5f8b', b: 'Turns stiff text into natural writing', ph: 'Paste the text to humanize', s: ['Leveraging synergies, we deliver value-driven outcomes.', 'It is important to note that time management is crucial.', 'I am writing to express my sincere interest in the position.'] }
};
const key = 'viora_chats_' + S.email;
let chats = ls.get(key, []), cur = null, asst = ls.get('viora_assistant', 'flash'), web = ls.get('viora_web', true), busy = null, filter = '';
if (!A[asst]) asst = 'flash';
const save = () => ls.set(key, chats.slice(0, 80));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chat = () => chats.find(c => c.id === cur);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
function md(src, srcs) {
  const blocks = [];
  let t = esc(src).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (m, l, c) => { blocks.push('<pre><code>' + c.replace(/\n$/, '') + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/^#{1,3} (.*)$/gm, '<h3>$1</h3>').replace(/^(?:- |\* )(.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m.replace(/\n/g, '') + '</ul>');
  if (srcs && srcs.length) t = t.replace(/\[(\d{1,2})\]/g, (m, n) => srcs[n - 1] ? `<a class="cite" href="${esc(srcs[n - 1].url)}" target="_blank" rel="noopener noreferrer" title="${esc(srcs[n - 1].title)}">${n}</a>` : m);
  t = t.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
  return ('<p>' + t + '</p>').replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[i]).replace(/<p>(<(ul|pre|h3)[\s\S]*?<\/\2>)<\/p>/g, '$1').replace(/(<\/(?:ul|pre|h3)>)(<br>)+/g, '$1').replace(/(<br>)+(<(?:ul|pre|h3)\b)/g, '$2').replace(/<p>(<br>)*<\/p>/g, '');
}
const grp = ts => { const d = (Date.now() - ts) / 864e5; return d < 1 ? 'Today' : d < 2 ? 'Yesterday' : d < 8 ? 'Previous 7 days' : 'Older'; };
function side() {
  const list = chats.filter(c => c.title.toLowerCase().includes(filter)); let last = '';
  $('#hist').innerHTML = list.map(c => { const g = grp(c.updated || +c.id), h = g !== last ? `<div class="grp">${g}</div>` : ''; last = g;
    return h + `<div class="it${c.id === cur ? ' on' : ''}" data-id="${c.id}"><span>${esc(c.title)}</span><button data-del="${c.id}" aria-label="Delete chat">×</button></div>`; }).join('') || `<div class="emp">${filter ? 'No matches' : 'Your chats will show up here'}</div>`;
}
function msgHtml(m, i, last) {
  if (m.role === 'user') return `<div class="m u"><div class="b">${esc(m.content)}</div></div>`;
  const srcs = (m.src || []).map((s, n) => `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" title="${esc(s.title)}">${n + 1} · ${esc(host(s.url))}</a>`).join('');
  return `<div class="m a"><img src="assets/mark.png" alt=""><div class="col">${m.note ? `<div class="note">${esc(m.note)}</div>` : ''}${srcs ? `<div class="srcs">${srcs}</div>` : ''}<div class="b" id="b${i}">${m.content ? md(m.content, m.src) : '<span class="dots"></span>'}</div><div class="acts"><button data-copy="${i}">Copy</button>${last ? '<button data-regen>Regenerate</button>' : ''}</div></div></div>`;
}
function render() {
  const a = A[asst], c = chat(), has = c && c.messages.length;
  $('#main').classList.toggle('empty', !has);
  $('.pick i').style.setProperty('--c', a.c); $('#pname').textContent = a.n; $('#in').placeholder = a.ph;
  $('#web').hidden = !a.web; $('#web').classList.toggle('on', !!web); $('#att').hidden = asst === 'human';
  const h = new Date().getHours(), first = (S.name || S.email.split('@')[0]).split(' ')[0];
  $('#greet').innerHTML = `${h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}, ${esc(first)}<small>${esc(a.b)}</small>`;
  $('#sug').style.setProperty('--c', a.c); $('#sug').innerHTML = a.s.map(s => `<button type="button">${esc(s)}</button>`).join('');
  $('#chip').innerHTML = c && c.page ? `<div class="chip"><span>📄 ${esc(c.page.title || c.page.source)}</span><button id="unatt" aria-label="Remove page">×</button></div>` : '';
  $('#amenu').innerHTML = Object.entries(A).map(([k, v]) => `<button class="opt" data-k="${k}" style="--c:${v.c}"><i></i><div><b>${v.n}</b><span>${esc(v.b)}</span></div>${k === asst ? '<span class="ck">✓</span>' : ''}</button>`).join('');
  $('#msgs').innerHTML = has ? c.messages.map((m, i) => msgHtml(m, i, i === c.messages.length - 1 && !busy)).join('') : '';
  $('#go').disabled = !busy && !$('#in').value.trim();
  side(); const s = $('#scroll'); s.scrollTop = s.scrollHeight;
}
function sendState(on) { $('#go').textContent = on ? '■' : '↑'; $('#go').setAttribute('aria-label', on ? 'Stop' : 'Send'); $('#go').disabled = false; }
async function send(text) {
  text = (text || '').trim(); if (!text || busy) return;
  let c = chat();
  if (!c) { c = { id: String(Date.now()), title: text.slice(0, 44), assistant: asst, messages: [], page: null }; chats.unshift(c); cur = c.id; }
  c.assistant = asst; c.updated = Date.now(); chats = [c, ...chats.filter(x => x !== c)];
  c.messages.push({ role: 'user', content: text }, { role: 'assistant', content: '' });
  $('#in').value = ''; grow(); save(); render();
  const idx = c.messages.length - 1, m = c.messages[idx], ctl = new AbortController(); busy = ctl; sendState(true);
  const sc = $('#scroll'), paint = () => { const near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 140, b = $('#b' + idx); if (b) { b.innerHTML = m.content ? md(m.content, m.src) : '<span class="dots"></span>'; if (near) sc.scrollTop = sc.scrollHeight; } };
  const useWeb = !!(A[asst].web && web);
  try {
    const r = await fetch(API + '/api/chat', { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token },
      body: JSON.stringify({ assistant: asst === 'human' ? 'humanize' : asst, web: useWeb, messages: c.messages.slice(0, -1).map(x => ({ role: x.role, content: x.content })), page: c.page }) });
    if (r.status === 401) { localStorage.removeItem('viora_session'); location.replace('login.html'); return; }
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Something went wrong. Please try again.'); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', raf = 0;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) { if (!l.startsWith('data:')) continue; const d = l.slice(5).trim(); if (!d || d === '[DONE]') continue;
        try { const j = JSON.parse(d);
          if (j.viora_sources) { m.src = j.viora_sources; if (!m.src.length) m.note = 'Web search found nothing, so this answer is from what I already know.'; render(); }
          else { const t = j.choices?.[0]?.delta?.content; if (t) m.content += t; } } catch {} }
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); });
    }
    if (!m.content.trim()) m.content = 'I got an empty reply. Please try again.';
  } catch (e) {
    if (e.name === 'AbortError') { if (!m.content) m.content = '_Stopped._'; }
    else m.content = (m.content ? m.content + '\n\n' : '') + '⚠️ ' + (/fetch|network/i.test(e.message) ? 'Could not reach Viora. The server may be waking up, so try again in 30 seconds.' : e.message);
  }
  busy = null; sendState(false); save(); render();
}
function grow() { const t = $('#in'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; $('#go').disabled = !busy && !t.value.trim(); }
const wide = () => matchMedia('(min-width:821px)').matches;
const openSb = () => { wide() ? document.body.classList.remove('off') : (document.body.classList.add('drawer'), $('#shade').hidden = false); };
const closeSb = () => { wide() ? document.body.classList.add('off') : (document.body.classList.remove('drawer'), $('#shade').hidden = true); };
const newChat = () => { cur = null; render(); $('#in').focus(); if (!wide()) closeSb(); };
const hide = () => { $('#amenu').hidden = true; $('#umenu').hidden = true; };

/* attach a page */
const dlg = $('#dlg');
const plain = html => { const d = new DOMParser().parseFromString(html, 'text/html'); d.querySelectorAll('script,style,noscript,svg,template').forEach(n => n.remove()); return { title: (d.title || '').trim().slice(0, 200), text: (d.body?.textContent || html).replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n\n').trim().slice(0, 24000) }; };
function setPage(p, source) {
  let c = chat(); if (!c) { c = { id: String(Date.now()), title: (p.title || 'Attached page').slice(0, 44), assistant: asst, messages: [], page: null }; chats.unshift(c); cur = c.id; }
  c.page = { title: p.title, text: p.text, source }; save(); render();
}
$('#att').onclick = () => { $('#derr').textContent = ''; dlg.showModal(); };
$('#d-x').onclick = () => dlg.close();
$('#d-file').onchange = async e => { const f = e.target.files[0]; if (f) $('#d-txt').value = (await f.text()).slice(0, 1.5e6); e.target.value = ''; };
$('#d-ok').onclick = async () => {
  const url = $('#d-url').value.trim(), txt = $('#d-txt').value.trim(), err = $('#derr'), ok = $('#d-ok');
  err.textContent = ''; if (!url && !txt) { err.textContent = 'Enter a web address or paste some text.'; return; }
  ok.disabled = true; ok.textContent = 'Reading…';
  try {
    if (txt) { const p = /<\w+[^>]*>/.test(txt) ? plain(txt) : { title: 'Pasted text', text: txt.slice(0, 24000) }; if (!p.text) throw new Error('That page has no readable text.'); setPage(p, 'pasted'); }
    else { const r = await fetch(API + '/api/read', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: JSON.stringify({ url }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Could not read that page.'); if (!d.text) throw new Error('That page has no readable text.'); setPage(d, url); }
    $('#d-url').value = ''; $('#d-txt').value = ''; dlg.close();
  } catch (e) { err.textContent = e.message; }
  ok.disabled = false; ok.textContent = 'Read page';
};

/* events */
$('#go').onclick = () => busy ? busy.abort() : send($('#in').value);
$('#in').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); busy || send(e.target.value); } });
$('#in').addEventListener('input', grow);
addEventListener('keydown', e => { if (e.key === 'Escape') { busy?.abort(); hide(); } if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); newChat(); } });
$('#new').onclick = newChat; $('#close').onclick = closeSb; $('#open').onclick = openSb; $('#shade').onclick = closeSb;
$('#q').oninput = e => { filter = e.target.value.trim().toLowerCase(); side(); };
$('#web').onclick = () => { web = !web; ls.set('viora_web', web); render(); };
$('#pick').onclick = e => { e.stopPropagation(); $('#umenu').hidden = true; $('#amenu').hidden = !$('#amenu').hidden; };
$('#ubtn').onclick = e => { e.stopPropagation(); $('#amenu').hidden = true; $('#umenu').hidden = !$('#umenu').hidden; };
document.addEventListener('click', e => { if (!e.target.closest('.pop')) hide(); });
$('#amenu').onclick = e => { const b = e.target.closest('.opt'); if (!b) return; asst = b.dataset.k; ls.set('viora_assistant', asst); hide(); render(); $('#in').focus(); };
$('#hist').onclick = e => {
  const d = e.target.closest('[data-del]'); if (d) { chats = chats.filter(c => c.id !== d.dataset.del); if (cur === d.dataset.del) cur = null; save(); render(); return; }
  const it = e.target.closest('[data-id]'); if (it) { cur = it.dataset.id; asst = chat().assistant && A[chat().assistant] ? chat().assistant : asst; render(); if (!wide()) closeSb(); }
};
$('#sug').onclick = e => { const b = e.target.closest('button'); if (b) send(b.textContent); };
$('#msgs').onclick = e => {
  const cp = e.target.closest('[data-copy]'); if (cp) { navigator.clipboard?.writeText(chat().messages[+cp.dataset.copy].content); cp.textContent = 'Copied'; setTimeout(() => cp.textContent = 'Copy', 1400); return; }
  if (e.target.closest('[data-regen]')) { const c = chat(); c.messages.pop(); const u = c.messages.pop(); send(u.content); }
};
$('#chip').onclick = e => { if (e.target.id === 'unatt') { chat().page = null; save(); render(); } };
$('#theme').onclick = () => { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('viora_theme', n); } catch {} hide(); };
$('#out').onclick = () => { localStorage.removeItem('viora_session'); location.href = 'index.html'; };
const name = S.name || S.email.split('@')[0];
$('#nm').textContent = name; $('#av').innerHTML = S.picture ? `<img src="${esc(S.picture)}" alt="" referrerpolicy="no-referrer">` : esc(name[0].toUpperCase());
if (!wide()) document.body.classList.remove('off');
fetch(API + '/api/verify?token=' + encodeURIComponent(S.token)).then(r => { if (r.status === 401) { localStorage.removeItem('viora_session'); location.replace('login.html'); } }).catch(() => {});
render(); $('#in').focus();
})();
</script>
</body>
