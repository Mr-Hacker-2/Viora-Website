name: Viora Labs CMS checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/admin-labs-manager]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run website regression tests
        run: node --test tests/*.test.mjs
      - name: Check Labs JavaScript syntax
        run: |
          node --check assets/labs/labs.js
          node --check assets/labs/labs-article.js
          node --check admin/labs-admin.js
