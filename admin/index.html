<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<script src="../assets/x/prefs.js"></script>
<link rel="stylesheet" href="../assets/x/accent.css">
<link rel="stylesheet" href="../assets/x/prefs.css">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/v5.css">
<title>Admin sign in — Viora</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.admin-card{position:relative;width:min(100%,460px);padding:36px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow)}
.admin-brand{display:flex;align-items:center;gap:10px;margin-bottom:34px;color:var(--text);font-size:20px;font-weight:700;text-decoration:none}
.admin-brand img{width:32px;height:32px}
.admin-card h1{margin:0 0 10px;font-size:30px}
.admin-card p{color:var(--muted);line-height:1.6}
.admin-card .btn-google{margin-top:16px}
.admin-card [hidden]{display:none!important}
.admin-card .err{margin-top:14px}
</style>
</head>
<body data-page="admin">
<main class="admin-card">
  <a class="admin-brand" href="../index.html"><img src="../assets/mark.png" alt="">Viora</a>
  <section data-admin-gate>
    <h1>Admin sign in</h1>
    <p>Continue with the authorized Google account to open the admin area.</p>
    <div class="alert err" id="admin-err" role="alert" hidden></div>
    <button class="btn btn-google btn-block btn-lg" id="google" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>Continue with Google
    </button>
  </section>
  <section data-admin-content hidden>
    <h1>Admin</h1>
    <p>Signed in as <b id="admin-email"></b>.</p>
    <p>The admin area is ready.</p>
    <button class="btn btn-ghost" id="admin-signout" type="button">Sign out</button>
  </section>
  <section data-admin-denied hidden>
    <h1>Access denied</h1><p>This Google account is not authorized for the admin area.</p>
    <a class="btn btn-ghost" href="./">Try again</a>
  </section>
</main>
<script src="../assets/app.js"></script>
</body>
</html>
